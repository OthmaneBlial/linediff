[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linediff"
version = "0.1.3"
description = "Exact text diffs with an optional Python definition view"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Othmane BLIAL", email = "blial.othmane@gmail.com"},
]
maintainers = [
    {name = "Othmane BLIAL", email = "blial.othmane@gmail.com"},
]
keywords = [
    "diff",
    "syntax-aware",
    "tree-sitter",
    "git",
    "comparison",
    "structural-diff",
    "code-analysis",
    "development-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
python = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]
tree-sitter = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-html==0.23.2",
    "tree-sitter-css==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff==0.16.8",
    "build>=1",
    "twine>=5",
]

[project.scripts]
linediff = "linediff.__main__:main"

[project.urls]
Homepage = "https://github.com/OthmaneBlial/linediff"
Repository = "https://github.com/OthmaneBlial/linediff.git"
Issues = "https://github.com/OthmaneBlial/linediff/issues"
Changelog = "https://github.com/OthmaneBlial/linediff/blob/main/CHANGELOG.md"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 88
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["linediff"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
