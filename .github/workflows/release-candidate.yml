name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in pyproject.toml and CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          actual = version("linediff")
          requested = os.environ["REQUESTED_VERSION"]
          if actual != requested:
              raise SystemExit("Requested version does not match package metadata")
          PY
      - name: Validate and build
        run: PYTHON=python bash scripts/release-kit.sh --build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: linediff-candidate-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: linediff-candidate-${{ inputs.version }}
          path: dist/
      - name: Install candidate archives outside checkout
        run: python scripts/smoke_dist.py dist

  standalone:
    needs: [package, package-smoke]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.22.3
      - name: Build and smoke-test standalone archive
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version }}
        run: python scripts/build_standalone.py --out-dir standalone --label "$VERSION_LABEL"
      - uses: actions/upload-artifact@v7
        with:
          name: linediff-standalone-${{ matrix.os }}-${{ inputs.version }}
          path: standalone/
          if-no-files-found: error
          retention-days: 14
