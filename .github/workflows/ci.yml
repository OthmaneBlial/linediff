name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.8
      - run: ruff check src/linediff tests scripts
      - run: ruff format --check src/linediff tests scripts
      - run: python scripts/check_docs.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
        env:
          LINEDIFF_EXPECT_PARSERS: none

  grammars:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [python, full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python grammar
        if: matrix.profile == 'python'
        run: python -m pip install -e '.[python]' pytest
      - name: Install all declared grammars
        if: matrix.profile == 'full'
        run: python -m pip install -e '.[tree-sitter]' pytest
      - run: python -m pytest -q
        env:
          LINEDIFF_EXPECT_PARSERS: ${{ matrix.profile }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install '.[tree-sitter]' pip-audit==2.10.1
      - run: python -m pip_audit --local --skip-editable --progress-spinner off
      - name: Scan Git history for secrets
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-level warn .

  package:
    needs: [quality, test, grammars, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: linediff-distributions
          path: dist/
          if-no-files-found: error

  standalone:
    needs: [quality, test, grammars, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.22.3
      - name: Build, unpack and smoke-test
        shell: bash
        env:
          BUILD_LABEL: dev-${{ github.sha }}
        run: python scripts/build_standalone.py --out-dir standalone --label "$BUILD_LABEL"
      - uses: actions/upload-artifact@v7
        with:
          name: linediff-standalone-${{ matrix.os }}
          path: standalone/
          if-no-files-found: error

  benchmark:
    needs: [quality, test, grammars]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . psutil==7.2.2
      - name: Measure fixture time and peak memory
        shell: bash
        run: python scripts/benchmark.py --repeats 3 --timeout-seconds 15 --max-cli-ms 500 --max-worker-rss-mib 64 > benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linediff-benchmark-${{ matrix.os }}
          path: benchmark.json
          if-no-files-found: error
